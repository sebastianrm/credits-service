openapi: 3.2.1
info:
  title: Yanki Credits Service API
  version: 1.0.0
  description: >
    Contrato OpenAPI del microservicio credits-service (puerto 8084).
    Documenta los 12 endpoints de gestión de créditos personales y empresariales,
    incluyendo creación con scoring, consulta con caché Redis, registro de pagos,
    corrección y reversa de pagos, consulta de cronogramas, y detección de mora.
    
    **Arquitectura Hexagonal:** Dominio puro con RxJava 3, puertos de entrada/salida,
    adaptadores MongoDB/Redis/Kafka.
    
    **Stack:** Java 17, Spring Boot 3.3.5, RxJava 3, MongoDB, Redis, Kafka,
    Eureka, Resilience4j, Docker, Swagger/OpenAPI.
    
    **Referencias:**
    - Casos de Uso: CU-03 (Gestión de Créditos), CU-06 (Pagos de Créditos)
    - Diagramas: SEC025 a SEC029
    - Test Cases: `test-cases/README.md`
    - Pruebas JUnit: 82 tests en 8 test classes
  contact:
    name: Yanki Platform Team
    email: yanki-platform@yanki.com
  license:
    name: Propietario
    url: https://yanki.com
servers:
  - url: http://localhost:8084
    description: Desarrollo local
  - url: http://localhost:8080
    description: API Gateway (Docker compose)
  - url: https://staging.yanki.com/credits
    description: Entorno de staging
  - url: https://api.yanki.com/credits
    description: Producción
tags:
  - name: Credits
    description: Operaciones de originación, consulta, actualización y cancelación de créditos
  - name: Payments
    description: Operaciones de registro, consulta, corrección y reversa de pagos de créditos
  - name: Operations
    description: Operaciones operativas y batch expuestas por API (job de mora)

paths:
  /api/credits:
    post:
      tags: [Credits]
      summary: Crear un nuevo crédito
      description: >
        Crea un nuevo crédito personal o empresarial validando las reglas de negocio:
        
        - Verifica que el cliente existe y está activo
        - Verifica que el cliente no tiene deuda vencida mayor a 30 días
        - Para créditos personales: valida que no exista un crédito activo previo (límite de 1)
        - Ejecuta scoring básico de montos, tasas y plazos
        - Genera automáticamente el cronograma de pagos con sistema francés (cuotas fijas)
        - Publica el evento credit.opened.v1 en Kafka
        - Almacena el cronograma en caché Redis para consultas rápidas
      operationId: createCredit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditRequest'
            example:
              customerId: "cust-12345"
              type: "PERSONAL"
              amount: 10000.00
              interestRate: 12.50
              termMonths: 12
              purpose: null
              collateralDescription: null
      responses:
        '201':
          description: Crédito creado exitosamente con cronograma generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResponse'
              example:
                id: "cred-abc123"
                customerId: "cust-12345"
                type: "PERSONAL"
                status: "APPROVED"
                principalAmount: 10000.00
                interestRate: 12.50
                termMonths: 12
                outstandingBalance: 10000.00
                nextDueDate: "2026-12-15"
                firstDueDate: "2026-12-15"
                maturityDate: "2027-11-15"
                paymentFrequency: "MONTHLY"
                purpose: null
                schedule:
                  - installmentNumber: 1
                    dueDate: "2026-12-15"
                    capitalAmount: 796.33
                    interestAmount: 104.17
                    feeAmount: 0.00
                    totalAmount: 900.50
                    status: "PENDING"
                approvedAt: "2026-11-14T10:30:00"
                createdAt: "2026-11-14T10:00:00"
                updatedAt: "2026-11-14T10:00:00"
        '400':
          description: Solicitud inválida: monto, tasa o plazo fuera de rango
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                scoringRejected:
                  summary: Scoring rechazado
                  value:
                    error: "SCORING_REJECTED"
                    message: "El crédito no cumple con los criterios de aprobación"
                    timestamp: "2026-11-14T10:00:00"
                invalidInterestRate:
                  summary: Tasa de interés inválida
                  value:
                    error: "INVALID_INTEREST_RATE"
                    message: "La tasa de interés debe estar entre 0.01% y 50%"
                    timestamp: "2026-11-14T10:00:00"
        '403':
          description: Operación prohibida: cliente inactivo o con deuda vencida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                customerInactive:
                  summary: Cliente inactivo
                  value:
                    error: "CUSTOMER_INACTIVE"
                    message: "El cliente no está activo"
                    timestamp: "2026-11-14T10:00:00"
                customerHasOverdueDebt:
                  summary: Cliente con deuda vencida
                  value:
                    error: "CUSTOMER_HAS_OVERDUE_DEBT"
                    message: "El cliente tiene deuda vencida mayor a 30 días. No puede solicitar nuevos productos"
                    timestamp: "2026-11-14T10:00:00"
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CUSTOMER_NOT_FOUND"
                message: "Cliente no encontrado: cust-12345"
                timestamp: "2026-11-14T10:00:00"
        '409':
          description: Conflicto de negocio: crédito personal ya activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "PERSONAL_CREDIT_LIMIT_EXCEEDED"
                message: "El cliente ya tiene un crédito personal activo. Máximo 1 permitido"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "INTERNAL_ERROR"
                message: "Error interno del servidor"
                timestamp: "2026-11-14T10:00:00"

    get:
      tags: [Credits]
      summary: Listar créditos con filtros opcionales
      description: >
        Devuelve una lista de créditos filtrados por cliente, tipo y estado.
        Si no se proporcionan filtros, devuelve todos los créditos del sistema.
        Los filtros son combinables entre sí.
      operationId: listCredits
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: customerId
          schema:
            type: string
          description: Filtrar por identificador del cliente titular. Ejemplo: cust-12345
          example: "cust-12345"
        - in: query
          name: type
          schema:
            type: string
            enum: [PERSONAL, BUSINESS, MORTGAGE]
          description: Filtrar por tipo de crédito
          example: "PERSONAL"
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, APPROVED, ACTIVE, PAID_OFF, OVERDUE, CANCELLED]
          description: Filtrar por estado del crédito
          example: "ACTIVE"
      responses:
        '200':
          description: Lista de créditos obtenida exitosamente (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditResponse'
              example:
                - id: "cred-abc123"
                  customerId: "cust-12345"
                  type: "PERSONAL"
                  status: "ACTIVE"
                  principalAmount: 10000.00
                  interestRate: 12.50
                  termMonths: 12
                  outstandingBalance: 7500.00
                  nextDueDate: "2026-12-15"
                  firstDueDate: "2026-11-15"
                  maturityDate: "2027-10-15"
                  paymentFrequency: "MONTHLY"
                  purpose: null
                  schedule: []
                  approvedAt: "2026-11-14T10:30:00"
                  createdAt: "2026-11-14T10:00:00"
                  updatedAt: "2026-11-14T15:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/credits/{id}:
    get:
      tags: [Credits]
      summary: Consultar un crédito por identificador
      description: >
        Devuelve los detalles completos de un crédito por su identificador único.
        Incluye el cronograma de pagos completo.
        Utiliza caché Redis para optimizar consultas repetidas del cronograma.
      operationId: getCreditById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
      responses:
        '200':
          description: Crédito encontrado con todos sus detalles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResponse'
        '404':
          description: Crédito no encontrado con el identificador proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CREDIT_NOT_FOUND"
                message: "Crédito no encontrado: cred-abc123"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Credits]
      summary: Actualizar la tasa de interés de un crédito
      description: >
        Actualiza la tasa de interés de un crédito existente y regenera el cronograma de pagos.
        Se utiliza para reestructuraciones de crédito.
        
        Reglas de negocio:
        - Solo se puede actualizar un crédito en estado APPROVED o ACTIVE
        - La nueva tasa debe estar entre 0.01% y 50%
        - El cronograma de pagos se regenera automáticamente con el sistema francés
        - La caché Redis del cronograma se invalida y se actualiza
      operationId: updateCredit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreditRequest'
            example:
              interestRate: 10.50
      responses:
        '200':
          description: Crédito actualizado exitosamente con nuevo cronograma
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResponse'
        '400':
          description: Tasa de interés inválida (fuera de rango 0.01 a 50)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "INVALID_INTEREST_RATE"
                message: "La tasa de interés debe estar entre 0.01% y 50%"
                timestamp: "2026-11-14T10:00:00"
        '403':
          description: Operación prohibida: crédito pagado, cancelado o en mora
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "FORBIDDEN_OPERATION"
                message: "No se puede actualizar un crédito en estado PAID_OFF"
                timestamp: "2026-11-14T10:00:00"
        '404':
          description: Crédito no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CREDIT_NOT_FOUND"
                message: "Crédito no encontrado: cred-abc123"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Credits]
      summary: Cancelar un crédito
      description: >
        Cancela un crédito cambiando su estado a CANCELLED.
        
        Reglas de negocio:
        - Solo se puede cancelar un crédito en estado APPROVED o ACTIVE
        - No se puede cancelar un crédito ya pagado (PAID_OFF)
        - No se puede cancelar un crédito en mora (OVERDUE) sin regularizar primero
        - La caché Redis del cronograma se invalida
      operationId: cancelCredit
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
      responses:
        '200':
          description: Crédito cancelado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditResponse'
        '403':
          description: Operación prohibida: crédito pagado, ya cancelado o en mora
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "FORBIDDEN_OPERATION"
                message: "No se puede cancelar un crédito en estado PAID_OFF"
                timestamp: "2026-11-14T10:00:00"
        '404':
          description: Crédito no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CREDIT_NOT_FOUND"
                message: "Crédito no encontrado: cred-abc123"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/credits/{id}/schedule:
    get:
      tags: [Credits]
      summary: Consultar el cronograma de pagos de un crédito
      description: >
        Devuelve el cronograma completo de pagos de un crédito.
        Cada cuota incluye: número, fecha de vencimiento, monto de capital, interés, comisiones y total.
        El cronograma se genera con el sistema francés (cuotas fijas mensuales).
        Utiliza caché Redis para optimizar consultas repetidas.
      operationId: getCreditSchedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
      responses:
        '200':
          description: Cronograma de pagos obtenido exitosamente (lista vacía si no hay cronograma)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleInstallment'
              example:
                - installmentNumber: 1
                  dueDate: "2026-12-15"
                  capitalAmount: 796.33
                  interestAmount: 104.17
                  feeAmount: 0.00
                  totalAmount: 900.50
                  status: "PENDING"
                - installmentNumber: 2
                  dueDate: "2027-01-15"
                  capitalAmount: 796.33
                  interestAmount: 104.17
                  feeAmount: 0.00
                  totalAmount: 900.50
                  status: "PENDING"
        '404':
          description: Crédito no encontrado con el identificador proporcionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CREDIT_NOT_FOUND"
                message: "Crédito no encontrado: cred-abc123"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor al deserializar el cronograma
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/credits/{id}/payments:
    post:
      tags: [Payments]
      summary: Registrar un pago en un crédito
      description: >
        Registra un pago en un crédito existente aplicando el monto con orden de prioridad:
        1) Mora y comisiones vencidas
        2) Interés vencido
        3) Capital vencido
        4) Interés corriente
        5) Capital corriente
        6) Pago anticipado
        
        Si el saldo llega a cero, el crédito cambia automáticamente a estado PAID_OFF.
        Publica el evento credit.payment.registered.v1 en Kafka.
      operationId: registerCreditPayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            example:
              amount: 500.00
              source: "OWN_ACCOUNT"
              sourceAccountId: "acc-67890"
              payerCustomerId: null
              description: "Pago mensual de crédito"
      responses:
        '201':
          description: Pago registrado exitosamente con distribución detallada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
              example:
                id: "pay-xyz789"
                creditId: "cred-abc123"
                customerId: "cust-12345"
                amount: 500.00
                capitalPortion: 400.00
                interestPortion: 80.00
                feePortion: 20.00
                installmentNumber: 3
                dueDate: "2026-12-15"
                paidAt: "2026-11-14T14:30:00"
                source: "OWN_ACCOUNT"
                sourceAccountId: "acc-67890"
                status: "COMPLETED"
        '400':
          description: Monto de pago inválido (debe ser mayor a cero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "INVALID_PAYMENT_AMOUNT"
                message: "El monto del pago debe ser mayor a cero"
                timestamp: "2026-11-14T10:00:00"
        '403':
          description: Operación no permitida por estado del crédito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "FORBIDDEN_OPERATION"
                message: "No se puede registrar un pago en un crédito cancelado"
                timestamp: "2026-11-14T10:00:00"
        '404':
          description: Crédito no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CREDIT_NOT_FOUND"
                message: "Crédito no encontrado: cred-abc123"
                timestamp: "2026-11-14T10:00:00"
        '409':
          description: Conflicto: intento de pagar un crédito ya pagado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "CREDIT_ALREADY_PAID"
                message: "No se puede registrar un pago en un crédito ya pagado"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [Payments]
      summary: Listar los pagos de un crédito
      description: >
        Devuelve la lista histórica de todos los pagos registrados en un crédito.
        Cada pago incluye la distribución entre capital, interés y comisiones.
      operationId: listCreditPayments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
      responses:
        '200':
          description: Lista de pagos obtenida exitosamente (puede ser vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentResponse'
              example:
                - id: "pay-xyz789"
                  creditId: "cred-abc123"
                  customerId: "cust-12345"
                  amount: 500.00
                  capitalPortion: 400.00
                  interestPortion: 80.00
                  feePortion: 20.00
                  installmentNumber: 3
                  dueDate: "2026-12-15"
                  paidAt: "2026-11-14T14:30:00"
                  source: "OWN_ACCOUNT"
                  sourceAccountId: "acc-67890"
                  status: "COMPLETED"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/credits/{id}/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Consultar un pago específico por identificador
      description: >
        Devuelve los detalles completos de un pago registrado en un crédito,
        incluyendo la distribución del monto entre capital, interés y comisiones.
      operationId: getCreditPaymentById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Pago encontrado con todos sus detalles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          description: Pago o crédito no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                creditNotFound:
                  summary: Crédito no encontrado
                  value:
                    error: "CREDIT_NOT_FOUND"
                    message: "Crédito no encontrado: cred-abc123"
                    timestamp: "2026-11-14T10:00:00"
                paymentNotFound:
                  summary: Pago no encontrado
                  value:
                    error: "PAYMENT_NOT_FOUND"
                    message: "Pago no encontrado: pay-xyz789"
                    timestamp: "2026-11-14T10:00:00"
                paymentNotInCredit:
                  summary: Pago no pertenece al crédito
                  value:
                    error: "PAYMENT_NOT_IN_CREDIT"
                    message: "El pago pay-xyz789 no pertenece al crédito cred-abc123"
                    timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Payments]
      summary: Corregir un pago registrado
      description: >
        Corrige el monto de un pago ya registrado cuando se detecta un error en el monto ingresado.
        Ajusta automáticamente el saldo pendiente del crédito según la diferencia entre el monto original y el nuevo monto.
        
        Reglas de negocio:
        - Solo se puede corregir un pago de un crédito en estado APPROVED o ACTIVE
        - No se puede corregir un pago de un crédito cancelado o pagado totalmente
        - No se puede corregir un pago ya revertido
        - El nuevo monto debe ser mayor a cero
        - La caché Redis del cronograma se invalida
      operationId: updatePayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePaymentRequest'
            example:
              amount: 1500.00
      responses:
        '200':
          description: Pago corregido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          description: Monto corregido inválido (debe ser mayor a cero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "INVALID_PAYMENT_AMOUNT"
                message: "El monto del pago debe ser mayor a cero"
                timestamp: "2026-11-14T10:00:00"
        '403':
          description: Operación prohibida: crédito cancelado o pagado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "FORBIDDEN_OPERATION"
                message: "No se puede corregir un pago de un crédito cancelado"
                timestamp: "2026-11-14T10:00:00"
        '404':
          description: Crédito o pago no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto: pago ya revertido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "PAYMENT_REVERSED"
                message: "No se puede corregir un pago ya revertido"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags: [Payments]
      summary: Revertir un pago registrado
      description: >
        Revierte un pago ya registrado, devolviendo el monto al saldo pendiente del crédito.
        El pago se marca con estado REVERSED y no puede ser corregido ni revertido nuevamente.
        
        Reglas de negocio:
        - Solo se puede revertir un pago de un crédito en estado APPROVED, ACTIVE o PAID_OFF
        - Si el crédito estaba pagado (PAID_OFF), vuelve a estado ACTIVE
        - No se puede revertir un pago ya revertido
        - La caché Redis del cronograma se invalida
      operationId: reversePayment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CreditId'
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Pago revertido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '403':
          description: Operación prohibida: crédito cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "FORBIDDEN_OPERATION"
                message: "No se puede revertir un pago de un crédito cancelado"
                timestamp: "2026-11-14T10:00:00"
        '404':
          description: Crédito o pago no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflicto: pago ya revertido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "PAYMENT_ALREADY_REVERSED"
                message: "El pago ya fue revertido previamente"
                timestamp: "2026-11-14T10:00:00"
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/credits/jobs/overdue-detection:
    post:
      tags: [Operations]
      summary: Ejecutar manualmente el job de detección de mora
      description: >
        Dispara manualmente el job de detección de mora que normalmente se ejecuta
        diariamente a las 02:00 AM.
        
        El job:
        - Identifica créditos con cuotas vencidas mayor a 30 días
        - Cambia el estado de los créditos a OVERDUE
        - Publica el evento credit.overdue.v1 en Kafka para bloqueo transversal
        - Los clientes con mora son bloqueados para nuevos productos en toda la plataforma
      operationId: triggerOverdueDetection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Job de detección de mora ejecutado exitosamente
          content:
            application/json:
              schema:
                type: string
              example: "Job de deteccion de mora ejecutado"
        '500':
          description: Error interno del servidor al ejecutar el job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT validado por el API Gateway.
        En desarrollo local, el token puede estar vacío.
        En producción, obtenga el token del auth-service vía API Gateway.

  parameters:
    CreditId:
      in: path
      name: id
      required: true
      description: Identificador único del crédito
      schema:
        type: string
      example: "cred-abc123"

    PaymentId:
      in: path
      name: paymentId
      required: true
      description: Identificador único del pago
      schema:
        type: string
      example: "pay-xyz789"

  schemas:
    CreditType:
      type: string
      enum: [PERSONAL, BUSINESS, MORTGAGE]
      description: Tipo de crédito disponible en el sistema Yanki
      example: "PERSONAL"
      x-enum-varnames:
        - PERSONAL
        - BUSINESS
        - MORTGAGE
      x-enum-descriptions:
        - "Crédito personal para uso individual. Límite: 1 crédito activo por cliente. Monto máximo: $50,000."
        - "Crédito empresarial para empresas. Sin límite de cantidad activa. Monto máximo: $500,000."
        - "Crédito hipotecario para adquisición de inmuebles. Monto máximo: $2,000,000."

    CreditStatus:
      type: string
      enum: [PENDING, APPROVED, ACTIVE, PAID_OFF, OVERDUE, CANCELLED]
      description: Estado actual del crédito en su ciclo de vida
      example: "ACTIVE"
      x-enum-varnames:
        - PENDING
        - APPROVED
        - ACTIVE
        - PAID_OFF
        - OVERDUE
        - CANCELLED
      x-enum-descriptions:
        - "Crédito creado pero aún no aprobado"
        - "Crédito aprobado con cronograma generado pero aún no activado"
        - "Crédito activo y en período de pagos"
        - "Crédito completamente pagado y cerrado"
        - "Crédito con mora mayor a 30 días. Bloquea nuevos productos para el cliente."
        - "Crédito cancelado antes de su vencimiento"

    PaymentSource:
      type: string
      enum: [OWN_ACCOUNT, THIRD_PARTY, CASH]
      description: Fuente del pago del crédito
      example: "OWN_ACCOUNT"
      x-enum-varnames:
        - OWN_ACCOUNT
        - THIRD_PARTY
        - CASH
      x-enum-descriptions:
        - "Pago realizado desde la propia cuenta del titular del crédito"
        - "Pago realizado por un tercero diferente al titular del crédito"
        - "Pago en efectivo realizado en sucursal o punto de cobranza"

    CreateCreditRequest:
      type: object
      required: [customerId, type, amount, termMonths, interestRate]
      description: Solicitud para crear un nuevo crédito en el sistema Yanki
      properties:
        customerId:
          type: string
          description: Identificador único del cliente solicitante
          example: "cust-12345"
        type:
          $ref: '#/components/schemas/CreditType'
        amount:
          type: number
          format: double
          description: Monto principal solicitado en moneda local (USD)
          minimum: 0.01
          example: 10000.00
        termMonths:
          type: integer
          description: Plazo del crédito en meses. Rango válido: 1 a 36 meses.
          minimum: 1
          maximum: 36
          example: 12
        interestRate:
          type: number
          format: double
          description: Tasa de interés anual en porcentaje
          minimum: 0.01
          example: 12.50
        purpose:
          type: string
          nullable: true
          description: Propósito del crédito (obligatorio para créditos empresariales)
          example: "Compra de equipo de oficina"
        collateralDescription:
          type: string
          nullable: true
          description: Descripción del garantía ofrecida (aplicable a créditos hipotecarios)
          example: "Inmueble ubicado en Av. Principal 123"

    UpdateCreditRequest:
      type: object
      required: [interestRate]
      description: Solicitud para actualizar la tasa de interés de un crédito existente
      properties:
        interestRate:
          type: number
          format: double
          description: Nueva tasa de interés anual en porcentaje. Rango válido: 0.01 a 50.00
          minimum: 0.01
          maximum: 50.00
          example: 10.50

    CreatePaymentRequest:
      type: object
      required: [amount]
      description: Solicitud para registrar un pago en un crédito existente
      properties:
        amount:
          type: number
          format: double
          description: Monto del pago en moneda local (USD)
          minimum: 0.01
          example: 500.00
        source:
          $ref: '#/components/schemas/PaymentSource'
        sourceAccountId:
          type: string
          nullable: true
          description: Identificador de la cuenta de origen del pago (obligatorio si source es OWN_ACCOUNT o THIRD_PARTY)
          example: "acc-67890"
        payerCustomerId:
          type: string
          nullable: true
          description: Identificador del cliente que realiza el pago (obligatorio si source es THIRD_PARTY)
          example: "cust-99999"
        description:
          type: string
          nullable: true
          description: Descripción opcional del pago
          example: "Pago mensual de crédito"

    UpdatePaymentRequest:
      type: object
      required: [amount]
      description: Solicitud para corregir el monto de un pago registrado
      properties:
        amount:
          type: number
          format: double
          description: Nuevo monto del pago. Debe ser mayor a cero.
          minimum: 0.01
          example: 1500.00

    CreditResponse:
      type: object
      description: Respuesta detallada con la información completa de un crédito
      properties:
        id:
          type: string
          description: Identificador único del crédito
          example: "cred-abc123"
        customerId:
          type: string
          description: Identificador del cliente titular del crédito
          example: "cust-12345"
        type:
          $ref: '#/components/schemas/CreditType'
        status:
          $ref: '#/components/schemas/CreditStatus'
        principalAmount:
          type: number
          format: double
          description: Monto principal del crédito en USD
          example: 10000.00
        interestRate:
          type: number
          format: double
          description: Tasa de interés anual en porcentaje
          example: 12.50
        termMonths:
          type: integer
          description: Plazo total del crédito en meses
          example: 12
        outstandingBalance:
          type: number
          format: double
          description: Saldo pendiente actual del crédito en USD
          example: 7500.00
        nextDueDate:
          type: string
          format: date
          description: Fecha de vencimiento de la próxima cuota (formato YYYY-MM-DD)
          example: "2026-12-15"
        firstDueDate:
          type: string
          format: date
          description: Fecha de la primera cuota (formato YYYY-MM-DD)
          example: "2026-11-15"
        maturityDate:
          type: string
          format: date
          description: Fecha de vencimiento final del crédito (formato YYYY-MM-DD)
          example: "2027-10-15"
        paymentFrequency:
          type: string
          description: Frecuencia de pago del crédito
          example: "MONTHLY"
        purpose:
          type: string
          nullable: true
          description: Propósito del crédito (aplicable a créditos empresariales)
          example: "Compra de equipo"
        schedule:
          type: array
          description: Cronograma de pagos con el detalle de cada cuota
          items:
            $ref: '#/components/schemas/ScheduleInstallment'
        approvedAt:
          type: string
          format: date-time
          description: Fecha y hora de aprobación del crédito (formato ISO-8601)
          example: "2026-11-14T10:30:00"
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de creación del crédito (formato ISO-8601)
          example: "2026-11-14T10:00:00"
        updatedAt:
          type: string
          format: date-time
          description: Fecha y hora de última actualización del crédito (formato ISO-8601)
          example: "2026-11-14T15:00:00"

    PaymentResponse:
      type: object
      description: Respuesta con el detalle de un pago registrado en un crédito
      properties:
        id:
          type: string
          description: Identificador único del pago
          example: "pay-xyz789"
        creditId:
          type: string
          description: Identificador del crédito al que se aplicó el pago
          example: "cred-abc123"
        customerId:
          type: string
          description: Identificador del cliente titular del crédito
          example: "cust-12345"
        amount:
          type: number
          format: double
          description: Monto total del pago en USD
          example: 500.00
        capitalPortion:
          type: number
          format: double
          description: Porción del monto aplicada a capital en USD
          example: 400.00
        interestPortion:
          type: number
          format: double
          description: Porción del monto aplicada a interés en USD
          example: 80.00
        feePortion:
          type: number
          format: double
          description: Porción del monto aplicada a comisiones y mora en USD
          example: 20.00
        installmentNumber:
          type: integer
          description: Número de cuota al que se aplicó el pago
          example: 3
        dueDate:
          type: string
          format: date
          description: Fecha de vencimiento de la cuota (formato YYYY-MM-DD)
          example: "2026-12-15"
        paidAt:
          type: string
          format: date-time
          description: Fecha y hora en que se realizó el pago (formato ISO-8601)
          example: "2026-11-14T14:30:00"
        source:
          $ref: '#/components/schemas/PaymentSource'
        sourceAccountId:
          type: string
          nullable: true
          description: Identificador de la cuenta de origen del pago
          example: "acc-67890"
        status:
          type: string
          description: Estado del pago
          example: "COMPLETED"

    ScheduleInstallment:
      type: object
      description: Detalle de una cuota individual del cronograma de pagos del crédito
      properties:
        installmentNumber:
          type: integer
          description: Número secuencial de la cuota
          example: 1
        dueDate:
          type: string
          format: date
          description: Fecha de vencimiento de la cuota (formato YYYY-MM-DD)
          example: "2026-12-15"
        capitalAmount:
          type: number
          format: double
          description: Monto de capital de esta cuota en USD
          example: 400.00
        interestAmount:
          type: number
          format: double
          description: Monto de interés de esta cuota en USD
          example: 83.33
        feeAmount:
          type: number
          format: double
          description: Monto de comisiones y mora de esta cuota en USD
          example: 0.00
        totalAmount:
          type: number
          format: double
          description: Monto total de la cuota (capital + interés + comisiones) en USD
          example: 483.33
        status:
          type: string
          description: Estado de la cuota. Valores: PENDING, PAID, OVERDUE
          example: "PENDING"

    Error:
      type: object
      required: [error, message, timestamp]
      description: Respuesta de error estandarizada del servicio de créditos
      properties:
        error:
          type: string
          description: Código identificador del error
          example: "CREDIT_NOT_FOUND"
        message:
          type: string
          description: Mensaje descriptivo del error en español
          example: "Crédito no encontrado: cred-123"
        timestamp:
          type: string
          format: date-time
          description: Marca de tiempo del error en formato ISO-8601
          example: "2026-11-14T18:30:00"
